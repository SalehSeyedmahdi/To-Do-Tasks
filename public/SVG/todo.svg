    <line x1="7.5"  y1="6.5"  x2="20.5" y2="6.5"/>
    <line x1="7.5"  y1="12"   x2="20.5" y2="12"/>
    <line x1="7.5"  y1="17.5" x2="20.5" y2="17.5"/>
